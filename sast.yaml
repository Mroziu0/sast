name: SAST with CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up CodeQL
        uses: github/codeql-action/setup@v1
        with:
          languages: javascript # Choose your language (e.g., python, java, etc.)

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v1
        with:
          category: security
          output: results.sarif
