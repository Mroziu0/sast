name: SAST with CodeQL

on:
  push:
    branches: [main, sast]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python 

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with: 
          category: security
          output: results.sarif
      - name: Show CodeQL results
        if: always()
        run: |
          echo "CodeQL Analysis Results:"
          cat /home/runner/work/sast/sast/results.sarif/python.sarif

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-results.json

      - name: Show Bandit results
        if: always()
        run: |
          cat bandit-results.json
          
      - name: Install Snyk CLI
          run: pip install snyk
    
      - name: Run Snyk Test
        run: snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  
      - name: Run Snyk Monitor
        run: snyk monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}